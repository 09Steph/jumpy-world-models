# Conda environment for jumpy-world-models.
#
# USE `bash setup_env.sh`, NOT a bare `conda env update`. The script also
# installs flax and the cluster cuDNN fix, neither of which this file can do.
#
# flax==0.12.7 is deliberately absent: its metadata demands jax>=0.10.0, which
# conflicts with the jax pin below, so the resolver refuses the whole file even
# though the pair works. Install with `pip install --no-deps flax==0.12.7`.
name: jumpy
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=2.4.6
  - pytest
  - pip
  - pip:
      # Never collapse these two into one unconditional pin. That silently
      # installs CPU-only jaxlib on the cluster with no error.
      - jax==0.7.2; sys_platform == "darwin"
      - jax[cuda12]==0.7.2; sys_platform == "linux"
      # Required, not decorative. jax[cuda12]'s own ranges are unbounded, so
      # an unpinned resolve can land on a broken CUDA combination.
      - nvidia-cublas-cu12==12.4.5.8; sys_platform == "linux"
      - nvidia-cuda-cupti-cu12==12.4.127; sys_platform == "linux"
      - nvidia-cuda-nvrtc-cu12==12.4.127; sys_platform == "linux"
      - nvidia-cuda-runtime-cu12==12.4.127; sys_platform == "linux"
      - nvidia-cudnn-cu12==9.24.0.43; sys_platform == "linux"
      - nvidia-cufft-cu12==11.2.1.3; sys_platform == "linux"
      - nvidia-curand-cu12==10.3.5.147; sys_platform == "linux"
      - nvidia-cusolver-cu12==11.6.1.9; sys_platform == "linux"
      - nvidia-cusparse-cu12==12.3.1.170; sys_platform == "linux"
      - nvidia-cusparselt-cu12==0.6.2; sys_platform == "linux"
      - nvidia-nccl-cu12==2.21.5; sys_platform == "linux"
      - nvidia-nvjitlink-cu12==12.4.127; sys_platform == "linux"
      - nvidia-nvshmem-cu12==3.7.0; sys_platform == "linux"
      - nvidia-nvtx-cu12==12.4.127; sys_platform == "linux"
      - distrax==0.1.9
      - navix==0.7.4
      - orbax-checkpoint==0.12.0
      - optax==0.2.8
      # pandas MUST stay below 3. rliable's bootstrap engine (arch) calls a
      # pandas API whose signature 3.x changed, and rliable.library FAILS ON
      # IMPORT. arch is pinned for the same reason one step out.
      - rliable==1.2.0
      - arch==7.2.0
      - pandas==2.3.3
      - scipy==1.17.1
      - gymnasium==1.3.0
      - minigrid==3.1.0
      # KNOWN LIMITATION: nightly builds are eventually removed from PyPI, so
      # this pin has a shelf life and a clean install may one day fail to
      # resolve it.
      - tfp-nightly==0.26.0.dev20260725
