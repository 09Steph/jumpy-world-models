# Conda environment for jumpy-world-models.
#
# flax is installed by setup_env.sh, pinned to the version the results used.
name: jumpy
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=2.4.6
  - pytest
  # Trajectory storage: HDF5 on a Minari-like per-episode schema. From
  # conda-forge, to build against the conda numpy.
  - h5py=3.16.0
  - matplotlib=3.11.1
  - pip
  - pip:
      # Never collapse these two into one unconditional pin. That silently
      # installs CPU-only jaxlib on the cluster with no error.
      - jax==0.7.2; sys_platform == "darwin"
      - jax[cuda12]==0.7.2; sys_platform == "linux"
      # The CUDA stack is pinned; jax[cuda12]'s own ranges are unbounded.
      - nvidia-cublas-cu12==12.4.5.8; sys_platform == "linux"
      - nvidia-cuda-cupti-cu12==12.4.127; sys_platform == "linux"
      - nvidia-cuda-nvrtc-cu12==12.4.127; sys_platform == "linux"
      - nvidia-cuda-runtime-cu12==12.4.127; sys_platform == "linux"
      - nvidia-cudnn-cu12==9.8.0.87; sys_platform == "linux"
      - nvidia-cufft-cu12==11.2.1.3; sys_platform == "linux"
      - nvidia-curand-cu12==10.3.5.147; sys_platform == "linux"
      - nvidia-cusolver-cu12==11.6.1.9; sys_platform == "linux"
      - nvidia-cusparse-cu12==12.3.1.170; sys_platform == "linux"
      - nvidia-cusparselt-cu12==0.6.2; sys_platform == "linux"
      - nvidia-nccl-cu12==2.21.5; sys_platform == "linux"
      - nvidia-nvjitlink-cu12==12.4.127; sys_platform == "linux"
      - nvidia-nvshmem-cu12==3.7.0; sys_platform == "linux"
      - nvidia-nvtx-cu12==12.4.127; sys_platform == "linux"
      - distrax==0.1.9
      - navix==0.7.4
      # navix imports wandb when it is imported. Nothing in this project calls it.
      - wandb==0.28.0
      - orbax-checkpoint==0.12.0
      - optax==0.2.8
      # pandas must stay below 3. rliable's bootstrap engine (arch) calls a
      # pandas API that 3.x changed, and rliable.library fails on import.
      - rliable==1.2.0
      - arch==7.2.0
      - pandas==2.3.3
      - scipy==1.17.1
      # gymnasium is pinned by nle, which demands exactly 1.0.0. minigrid
      # accepts >=0.28.1, so the pin satisfies every dependent.
      - gymnasium==1.0.0
      - minigrid==3.1.0
      # NetHack Learning Environment. It compiles from C source on macOS arm64,
      # where no wheel exists, and installs a wheel on Linux, so the platforms
      # do not resolve identically.
      - nle==1.2.0
      - tfp-nightly==0.26.0.dev20260725
      # Arcade Learning Environment. gymnasium>=1.1.0 appears only under its
      # optional extras, so the 1.0.0 pin nle demands above is untouched.
      - ale-py==0.12.1
